<script>
/* ---------- content ---------- */
const GROUPS = [
  {title:"start here", items:["intro"]},
  {title:"basics & files", items:["q1","q2","q3","q4","q5","q6","q7","q7b"]},
  {title:"errors & oop", items:["q8","q9","q10","q11","q11b"]},
  {title:"real devops patterns", items:["q12","q13","q14","q15"]},
  {title:"modules: os / sys / env", items:["q16","q17","q18","q24"]},
  {title:"apis & regex", items:["q19","q20","q21","q22"]},
  {title:"combined & bonus", items:["q23","q25","qbonus"]},
  {title:"commonly missed", items:["q26","q27","q28","q29","q30","q31"]},
  {title:"reference", items:["cheatsheet","tools","history"]}
];

const QUESTIONS = [
{id:"q1", module:"File handling", hot:true, title:"Count ERROR lines in a log file",
 approach:`<p>This is <strong>grep -c 'ERROR' app.log</strong> wearing a Python costume. Say it out loud: "I open the file, walk through it line by line, and every time I see ERROR in that line, I bump a counter."</p>
 <p>Name the three moves the interviewer is listening for: <strong>open → loop → count</strong>. Also mention that <code>with open(...)</code> auto-closes the file even if something goes wrong &mdash; a free point most beginners forget to say.</p>`,
 code:`# app.log
INFO Start
ERROR DB Down
INFO Retry
ERROR Timeout

count = 0
with open("app.log") as file:
    for line in file:
        if "ERROR" in line:
            count += 1

print(f"Total Errors: {count}")`,
 runnable:`log_text = """INFO Start
ERROR DB Down
INFO Retry
ERROR Timeout"""

count = 0
for line in log_text.splitlines():
    if "ERROR" in line:
        count += 1

print(f"Total Errors: {count}")`,
 runNote:"Adapted: reads from a string here instead of a real file, since there's no disk in this sandbox. with open(...) works identically against a real file.",
 autoGrade:"output",
 type:"number", prompt:"Given the log shown above, what number does this script print?", answer:2,
 hint:"Recount by hand: how many of the 4 lines contain the substring ERROR?",
 solution:`count = 0
with open("app.log") as file:
    for line in file:
        if "ERROR" in line:
            count += 1
print(f"Total Errors: {count}")  # Total Errors: 2`,
 why:["<code>with open()</code> closes the file automatically, even if an error happens mid-loop.","<code>in</code> does a substring check &mdash; it doesn't need ERROR to be the whole line.","This open → loop → count shape reappears in almost every log-parsing question."],
 memoryHook:"open → loop → count. Say those three words and you can rebuild this from scratch every time it comes up."},

{id:"q2", module:"Lists & dicts", title:"Print only the running servers",
 approach:`<p>In bash you might reach for <strong>jq '.[] | select(.status=="running") | .host'</strong>. That <code>select()</code> is just an <code>if</code> inside a loop in Python &mdash; and each server here is a dictionary, exactly like one row out of <code>kubectl get pods -o json</code>.</p>
 <p>Talk track: "I loop over the list, each item is a dict, I check the status key, and if it matches I print the host key."</p>`,
 code:`servers = [
    {"host": "web1", "status": "running"},

{id:"q7b", module:"Booleans & truthiness", hot:true, title:"Truthy, falsy, and is vs ==",
 approach:`<p>Bash equivalent: <strong>[ -z "$var" ]</strong> checks if a string is empty. Python does this automatically inside an <code>if</code> — an empty list, empty string, <code>0</code>, and <code>None</code> all behave like <code>False</code> ("falsy"); everything else behaves like <code>True</code> ("truthy"). So <code>if errors:</code> alone means "if this list is non-empty" — no need to write <code>len(errors) > 0</code>.</p>
 <p>Talk track: "I write if errors: instead of if len(errors) > 0: because empty containers are falsy — it's more Pythonic. And when I check for None specifically, I always use is, not == — None is a singleton, so is checks identity directly instead of relying on a value comparison."</p>`,
 code:`errors = []
result = None

if errors:
    print("Has errors")
else:
    print("No errors")

if result is None:
    print("Result not set yet")`,
 runnable:`errors = []

 hint:"An empty list is falsy, so the errors branch is skipped — same idea as [ -z ] in bash. result really is None, so that check is straightforwardly true.",
 solution:`if errors:
    print("Has errors")
else:
    print("No errors")
# No errors

if result is None:
    print("Result not set yet")
# Result not set yet`,
 why:["Falsy values in Python: empty containers (<code>[]</code>, <code>{}</code>, <code>\"\"</code>, <code>set()</code>), <code>0</code>, and <code>None</code> — everything else is truthy.","<code>if errors:</code> is the idiomatic way to ask 'is this list non-empty' — writing <code>len(errors) > 0</code> works but reads as non-native Python.","Compare to <code>None</code> with <code>is</code>, never <code>==</code> — <code>None</code> is a singleton, so <code>is</code> checks identity directly and is both faster and safer than relying on a value comparison."],
 memoryHook:"Empty / zero / None = falsy, everything else = truthy. Always compare to None with is, never ==."},

{id:"q9", module:"OOP", hot:true, title:"Build a Server class",

{id:"q11b", module:"OOP", hot:true, title:"Extend a parent method with super()",
 approach:`<p>Plain inheritance (<code>class X(Y): pass</code>) is the easy case interviewers use to introduce the topic — the real test is what happens when the child needs the parent's setup logic <em>plus</em> its own. That's <code>super()</code>: it calls the parent's version of a method so you don't have to copy-paste its code.</p>
 <p>Talk track: "super() calls the parent class's version of the method — I use it so I don't duplicate the parent's logic, I just run it first and then add what's new."</p>`,
 code:`class Server:
    def __init__(self, hostname):
        self.hostname = hostname

    def describe(self):
        return f"Server: {self.hostname}"

class LinuxServer(Server):
    def __init__(self, hostname, distro):
        super().__init__(hostname)
        self.distro = distro

    def describe(self):
        base = super().describe()
        return f"{base} ({self.distro})"

s = LinuxServer("web01", "Ubuntu")
print(s.describe())`,

{id:"q23", module:"Combined pattern", title:"Parse a log file into per-level counts",

        elif "ERROR" in line:
            result["ERROR"] += 1
        elif "WARNING" in line:
            result["WARNING"] += 1

{id:"q26", module:"*args / **kwargs", title:"Accept any number of arguments",
 approach:`<p>Bash equivalent: a function that reads <strong>$@</strong> to grab however many arguments got passed, however many there are. <code>*args</code> does the same for positional arguments (packed into a tuple); <code>**kwargs</code> does it for named/keyword arguments (packed into a dict).</p>
 <p>Talk track: "I use *args and **kwargs when I don't know in advance how many arguments will be passed — the function just accepts whatever shows up."</p>`,

{id:"q27", module:"Decorators", hot:true, title:"Write a retry decorator",
 approach:`<p>Bash equivalent: a wrapper like <strong>until cmd; do sleep 1; done</strong> that retries a flaky command. A decorator does the same for a Python function — it wraps it with extra behavior without touching the original function's code.</p>
 <p>Talk track: "A decorator is a function that takes a function and returns a new, wrapped version of it — @retry above a function is just shorthand for func = retry(func)."</p>`,
 code:`def retry(func):
    def wrapper(*args, **kwargs):
        for attempt in range(3):
            try:
                return func(*args, **kwargs)
            except Exception:
                print(f"Attempt {attempt+1} failed, retrying...")
        return "All retries failed"
    return wrapper

@retry
def flaky_health_check():
    raise Exception("timeout")

print(flaky_health_check())`,
 runnable:`def retry(func):

print(flaky_health_check())`,

{id:"q28", module:"Context managers", title:"Guarantee cleanup with a context manager",
 approach:`<p>Bash equivalent: <strong>trap 'cleanup' EXIT</strong> — code that's guaranteed to run when a block finishes, success or failure. A custom context manager does the same job for one specific block, via <code>__enter__</code> and <code>__exit__</code>.</p>
 <p>Talk track: "with calls __enter__ when the block starts and __exit__ when it ends — even if an exception happens inside — so it's the guaranteed-cleanup pattern, just scoped to one block instead of the whole script."</p>`,
 code:`class Timer:
    def __enter__(self):
        print("Started")
        return self

    def __exit__(self, exc_type, exc_val, exc_tb):
        print("Stopped")

with Timer():
    print("Doing work")`,

/* ---------- state ---------- */
const KEY = "devops-py-drill-progress-v3";
let progress = {};
try{
  const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
  if(raw && typeof raw === "object") progress = raw;
}catch(e){ progress = {}; }
function saveProgress(){ try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){} }
function isDone(id){ return !!(progress[id] && progress[id].status === "done"); }
function recordAttempt(id, answerText, correct){
  const p = progress[id] && typeof progress[id]==="object" ? progress[id] : {attempts:0};
  p.attempts = (p.attempts||0) + 1;
  p.lastAnswer = answerText;
  p.correct = correct;
  p.ts = Date.now();
  if(correct) p.status = "done";
  progress[id] = p;
  saveProgress();
}

const FLAT_IDS = GROUPS.flatMap(g=>g.items);
const STATIC_IDS = ["intro","cheatsheet","tools","history"];
function isValidId(id){ return !!getQ(id) || STATIC_IDS.includes(id); }
let currentId = (function(){
  const fromHash = (location.hash||"").slice(1);
  return isValidId(fromHash) ? fromHash : FLAT_IDS[0];
})();
function navigateTo(id){
  if(!isValidId(id)) id = FLAT_IDS[0];
  currentId = id;
  render();
  try{
    const wantHash = "#" + id;
    if(location.hash !== wantHash) history.pushState(null, "", wantHash);
  }catch(e){}
  window.scrollTo({top:0,behavior:"instant"});
}
window.addEventListener("popstate", ()=>{
  const id = (location.hash||"").slice(1);
  currentId = isValidId(id) ? id : FLAT_IDS[0];
  render();
  window.scrollTo({top:0,behavior:"instant"});
});

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hi(raw){
  const s = esc(raw);
  const re = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(def|class|self|import|for|in|if|elif|else|return|try|except|with|as|print|True|False|None|and|or|not|from|pass)\b|\b(\d+(?:\.\d+)*)\b/gm;
  return s.replace(re, (m, com, str, kw, num)=>{
    if(com!==undefined) return '<span class="c-com">'+com+'</span>';
    if(str!==undefined) return '<span class="c-str">'+str+'</span>';
    if(kw!==undefined) return '<span class="c-kw">'+kw+'</span>';
    if(num!==undefined) return '<span class="c-num">'+num+'</span>';
    return m;
  });
}
function norm(s){ return String(s).toLowerCase().replace(/\s+/g,"").replace(/['"]/g,""); }
function parseList(s){ return String(s).split(",").map(x=>norm(x)).filter(x=>x.length); }
function parseDict(s){
  const out = {};
  String(s).split(",").forEach(pair=>{
    const idx = pair.indexOf(":");
    if(idx===-1) return;
    const k = pair.slice(0,idx).trim().toLowerCase();
    const v = pair.slice(idx+1).trim();
    if(k) out[k] = v.replace(/[^0-9.-]/g,"");
  });
  return out;
}
function getQ(id){ return QUESTIONS.find(q=>q.id===id); }

function doneCount(){ return QUESTIONS.filter(q=>isDone(q.id)).length; }
function updateOverall(){
  const d = doneCount(), t = QUESTIONS.length;
  document.getElementById("overall-count").textContent = `${d} / ${t}`;
  const pct = t? Math.round(d/t*100):0;
  document.getElementById("overall-bar").style.width = pct+"%";
  document.getElementById("rail-fill").style.width = pct+"%";
}

/* ---------- sidebar ---------- */
function renderSidebar(){

  el.innerHTML = "";
  GROUPS.forEach(g=>{
    const h = document.createElement("div");

function labelFor(id){

}

/* ---------- skulpt runner ---------- */
function builtinRead(x){
  if(Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
    throw "File not found: '" + x + "'";
  return Sk.builtinFiles["files"][x];
}
function runInTerminal(code, termEl, onDone){
  termEl.innerHTML = '<span class="prompt-line">$ python app.py</span>';
  let outBuf = "";
  const finish = (result)=>{ if(typeof onDone === "function"){ try{ onDone(result); }catch(e){ console.error("onDone failed", e); } } };
  if(typeof Sk === "undefined"){
    const d = document.createElement("div");
    d.className = "err";
    d.textContent = "Python engine failed to load (network hiccup?). Paste this into Programiz instead.";
    termEl.appendChild(d);
    finish({hadError:true, output:"", errorText:"engine-not-loaded"});
    return;
  }
  Sk.configure({
    output: (text)=>{ outBuf += text; termEl.appendChild(document.createTextNode(text)); },
    read: builtinRead,
    __future__: Sk.python3
  });
  try{
    Sk.misceval.asyncToPromise(function(){
      return Sk.importMainWithBody("<stdin>", false, code, true);
    }).then(
      function(){ finish({hadError:false, output:outBuf, errorText:null}); },
      function(err){
        const d = document.createElement("div");
        d.className = "err";
        const msg = err.toString();
        d.textContent = msg;
        termEl.appendChild(d);
        finish({hadError:true, output:outBuf, errorText:msg});
      }
    );
  }catch(err){
    const d = document.createElement("div");
    d.className = "err";
    const msg = String(err);
    d.textContent = msg;
    termEl.appendChild(d);
    finish({hadError:true, output:outBuf, errorText:msg});
  }
}

/* ---------- auto-grade from a Run ---------- */
function extractNumbers(s){ return (String(s).match(/-?\d+(?:\.\d+)?/g)||[]).map(Number); }
function normBlob(s){ return String(s).toLowerCase().replace(/\s+/g,"").replace(/['"]/g,""); }
function outputMatches(q, stdout){
  const blob = normBlob(stdout);
  if(q.type==="number"){
    const nums = extractNumbers(stdout);
    return nums.length>0 && nums.every(n=>n===q.answer);
  }
  if(q.type==="text"){
    return (q.answer||[]).some(a=>blob.includes(norm(a)));
  }
  if(q.type==="list"){
    return (q.answer||[]).every(a=>blob.includes(norm(a)));
  }
  if(q.type==="contains"){
    return (q.mustContain||[]).every(part=>blob.includes(part));
  }
  if(q.type==="dict"){
    const pairs = {};
    const re = /['"]?(\w+)['"]?\s*:\s*(-?\d+)/g;
    let m;
    while((m = re.exec(stdout))){ pairs[m[1].toLowerCase()] = Number(m[2]); }
    const expectedKeys = Object.keys(q.answer||{});
    return expectedKeys.length>0 && expectedKeys.every(k=>pairs[k.toLowerCase()]===q.answer[k]) && Object.keys(pairs).length===expectedKeys.length;
  }
  return false;
}
function codeMatches(q, code){
  const blob = normBlob(code);
  return (q.mustContain||[]).every(part=>blob.includes(part));
}
function autoGradeFromRun(q, main, ta, result){
  try{
    const runFb = main.querySelector("#run-feedback");
    if(!runFb) return;
    runFb.classList.remove("show","ok","bad");

    if(result.hadError){
      runFb.classList.add("show","bad");
      runFb.innerHTML = '<span class="fb-title">Error — read the traceback above.</span>' + esc(q.hint||"Re-check the logic and run again.") + ' <span style="opacity:.7;">(The full approach is in the panel on the left.)</span>';
      return;
    }
    if(!q.autoGrade || q.type==="mcq") return;

    // Non-committal preview only — this does NOT mark the question done or advance you.
    // Real grading (and history) still happens via "Check answer" on the left, so you
    // always have to commit to a prediction instead of just watching fixed code run.
    const ok = q.autoGrade==="code" ? codeMatches(q, ta.value) : outputMatches(q, result.output);
    if(ok){
      runFb.classList.add("show","ok");
      runFb.innerHTML = '<span class="fb-title">Output looks right.</span>Type your prediction on the left and hit Check answer to lock it in.';
    } else {
      runFb.classList.add("show","bad");
      runFb.innerHTML = '<span class="fb-title">Ran fine, but that output doesn\'t look like the target yet.</span>' + esc(q.hint||"Re-check the logic above.");
    }
  }catch(err){
    console.error("autoGradeFromRun failed for", q && q.id, err);
  }
}
function syncGutter(ta, gutter){
  const lines = ta.value.split("\n").length;
  let out = "";
  for(let i=1;i<=lines;i++) out += i + "\n";
  gutter.textContent = out;
  gutter.scrollTop = ta.scrollTop;
}

const AUTO_PAIRS = {"(":")","[":"]","{":"}",'"':'"',"'":"'"};
const AUTO_CLOSERS = new Set(Object.values(AUTO_PAIRS));
function wireEditorKeys(ta, gutter){
  ta.addEventListener("input", ()=>syncGutter(ta, gutter));
  ta.addEventListener("scroll", ()=>{ gutter.scrollTop = ta.scrollTop; });
  ta.addEventListener("keydown", e=>{
    const start = ta.selectionStart, end = ta.selectionEnd, val = ta.value;

    if(e.key === "Tab"){
      e.preventDefault();
      ta.value = val.slice(0,start) + "    " + val.slice(end);
      ta.selectionStart = ta.selectionEnd = start + 4;
      syncGutter(ta, gutter);
      return;
    }

    if(e.key === "Enter"){
      e.preventDefault();
      const lineStart = val.lastIndexOf("\n", start-1) + 1;
      const currentLine = val.slice(lineStart, start);
      let indent = (currentLine.match(/^[ \t]*/) || [""])[0];
      if(/:\s*$/.test(currentLine)) indent += "    ";
      const insertion = "\n" + indent;
      ta.value = val.slice(0,start) + insertion + val.slice(end);
      ta.selectionStart = ta.selectionEnd = start + insertion.length;
      syncGutter(ta, gutter);
      return;
    }

    if(AUTO_CLOSERS.has(e.key) && start===end && val[start]===e.key){
      e.preventDefault();
      ta.selectionStart = ta.selectionEnd = start + 1;
      return;
    }

    if(AUTO_PAIRS[e.key]){
      e.preventDefault();
      const open = e.key, close = AUTO_PAIRS[e.key];
      if(start !== end){
        const selected = val.slice(start,end);
        ta.value = val.slice(0,start) + open + selected + close + val.slice(end);
        ta.selectionStart = start + 1; ta.selectionEnd = end + 1;
      } else {
        ta.value = val.slice(0,start) + open + close + val.slice(end);
        ta.selectionStart = ta.selectionEnd = start + 1;
      }
      syncGutter(ta, gutter);
      return;
    }

    if(e.key === "Backspace" && start===end && start>0){
      const before = val[start-1], after = val[start];
      if(AUTO_PAIRS[before] === after){
        e.preventDefault();
        ta.value = val.slice(0,start-1) + val.slice(start+1);
        ta.selectionStart = ta.selectionEnd = start - 1;
        syncGutter(ta, gutter);
      }
    }
  });
}

/* ---------- grading ---------- */
function grade(q, container){
  const fb = container.querySelector(".feedback");
  if(!fb) return;
  try{
    let answered = true;
    if(q.type==="mcq"){
      answered = !!container.querySelector("input[type=radio]:checked");
    } else {
      const inputEl = container.querySelector("input");
      answered = !!inputEl && inputEl.value.trim().length > 0;
    }
    if(!answered){
      fb.classList.remove("ok","bad");
      fb.classList.add("show","bad");
      fb.innerHTML = '<span class="fb-title">Hold on.</span>' + esc(q.type==="mcq" ? "Pick an option first." : "Type an answer first.");
      return;
    }

    let ok = false, answerText = "";
    if(q.type==="number"){
      const v = container.querySelector("input").value;
      answerText = v;
      ok = Number(v) === q.answer;
    } else if(q.type==="text"){
      const raw = container.querySelector("input").value;
      answerText = raw;
      ok = (q.answer||[]).map(norm).includes(norm(raw));
    } else if(q.type==="list"){
      const raw = container.querySelector("input").value;
      answerText = raw;
      const v = parseList(raw);
      const expected = (q.answer||[]).map(norm);
      ok = v.length===expected.length && v.every((x,i)=>x===expected[i]);
    } else if(q.type==="contains"){
      const raw = container.querySelector("input").value;
      answerText = raw;
      ok = (q.mustContain||[]).every(part=>norm(raw).includes(part));
    } else if(q.type==="dict"){
      const raw = container.querySelector("input").value;
      answerText = raw;
      const v = parseDict(raw);
      const expectedKeys = Object.keys(q.answer||{});
      ok = expectedKeys.every(k=>{
        const vv = v[k.toLowerCase()];
        return vv!==undefined && Number(vv)===q.answer[k];
      }) && Object.keys(v).length===expectedKeys.length;
    } else if(q.type==="mcq"){
      const sel = container.querySelector("input[type=radio]:checked");
      const idx = sel ? Number(sel.value) : -1;
      answerText = (q.options && q.options[idx]) || "";
      ok = !!sel && idx === q.answer;
    }

    recordAttempt(q.id, answerText, ok);

    fb.classList.remove("ok","bad");
    fb.classList.add("show", ok?"ok":"bad");
    if(ok){
      fb.innerHTML = '<span class="fb-title">Correct.</span>' + esc(q.memoryHook || "") +
        ' <button class="btn primary" style="margin-left:8px; padding:5px 14px; font-size:12.5px; vertical-align:middle;" onclick="goRelative(1)">Next →</button>';
      renderSidebar();
      updateOverall();
      const qview = container.closest(".qview");
      const nextBtn = qview && qview.querySelector(".btn-next");
      if(nextBtn) nextBtn.disabled = false;
    } else {
      fb.innerHTML = '<span class="fb-title">Not quite.</span>' + esc(q.hint || "Re-check the code above and try again.");
    }
  }catch(err){
    fb.classList.remove("ok"); fb.classList.add("show","bad");
    fb.innerHTML = '<span class="fb-title">Couldn\'t check that.</span>Something went wrong grading this — try again, or reveal the solution below.';
    console.error("grade() failed for", q && q.id, err);
  }
}

/* ---------- rendering ---------- */
function goHome(){ navigateTo("intro"); }

function render(){
  try{
    renderSidebar();
    updateOverall();
    const main = document.getElementById("main");
    const q = getQ(currentId);
    main.classList.toggle("wide", !!q);
    if(q){ renderQuestion(main, q); }
    else{ renderStatic(main, currentId); }
  }catch(err){
    console.error("render() failed", err);
    renderCrashFallback(err);
  }
}
function renderCrashFallback(err){
  const main = document.getElementById("main");
  if(!main) return;
  main.classList.remove("wide");
  main.innerHTML = `
    <div class="panel" style="text-align:center; padding:48px 28px;">
      <div class="panel-label" style="justify-content:center;">something glitched</div>
      <p style="color:var(--ink-mute); margin:0 0 18px;">This question hit a snag rendering. Your progress is saved — head back home or pick a different one from the sidebar.</p>
      <button class="btn primary" onclick="goHome()">Go home</button>
    </div>
  `;
}
function idxInFlat(id){ return FLAT_IDS.indexOf(id); }
function goRelative(delta){
  const i = idxInFlat(currentId);
  const next = FLAT_IDS[i+delta];
  if(next) navigateTo(next);
}

        </div>
        <div class="editor-row">
          <div class="gutter" id="gutter"></div>
          <textarea class="editor" id="editor" spellcheck="false">${esc(q.runnable)}</textarea>
        </div>
        <div class="term" id="term"></div>
      </div>

      ${q.runCaveat? `<div class="run-caveat">${esc(q.runCaveat)}</div>` : ""}
      ${(!q.autoGrade && q.type!=="mcq")? `<div class="run-note">Run checks for errors only here — use "Check answer" on the left to validate this one.</div>` : ""}

  main.innerHTML = `
    <div class="qview">

        <span class="tag mod">${esc(q.module)}</span>
        ${q.hot? '<span class="tag hot">Frequently asked</span>' : ''}
      </div>
      <h2 class="qtitle">${esc(q.title)}</h2>

      <div class="qgrid">
        <div class="qleft">
          <div class="panel approach">
            <div class="panel-label"><span class="prompt">$</span> how to talk through it</div>
            ${q.approach}
          </div>

            <div class="panel-label">validate before moving on</div>

            ${renderInput(q)}
            <div class="btnrow">
              <button class="btn primary" id="check-btn">Check answer</button>
              <button class="btn ghost" id="reveal-btn">I'm stuck — reveal</button>
            </div>
            <div class="feedback"></div>
          </div>

          <details class="solution" id="sol-details">
            <summary>Solution &amp; why it works</summary>
            <div class="inner">
              <pre class="code"><code>${hi(q.solution)}</code></pre>
              <ul>${q.why.map(w=>`<li>${w}</li>`).join("")}</ul>
            </div>
          </details>

          <div class="panel hook">
            <div class="panel-label">how to remember this for life</div>
            <p>${esc(q.memoryHook)}</p>
          </div>
        </div>

        <div class="qright">
          <details class="coderef">
            <summary>Reference: code as it'd appear in the interview</summary>
            <div class="inner"><pre class="code"><code>${hi(q.code)}</code></pre></div>
          </details>

        <button class="btn ghost btn-prev" ${idxInFlat(q.id)===0? "disabled":""}>← Back</button>

  if(q.runnable){

    const term = main.querySelector("#term");

    main.querySelector("#run-btn").onclick = ()=>{
      try{
        runInTerminal(ta.value, term, (result)=>autoGradeFromRun(q, main, ta, result));

      if(rf){ rf.classList.remove("show","ok","bad"); rf.innerHTML = ""; }
    };

function renderInput(q){
  if(q.type==="mcq"){
    return q.options.map((opt,i)=>`
      <label class="mcq-opt">
        <input type="radio" name="mcq" value="${i}">
        <span>${esc(opt)}</span>
      </label>`).join("");
  }
  const inputType = q.type==="number" ? "number" : "text";
  return `<input type="${inputType}" placeholder="Type your answer here...">`;
}

function renderStatic(main, id){
  if(id==="intro") return renderIntro(main);
  if(id==="cheatsheet") return renderCheatsheet(main);
  if(id==="tools") return renderTools(main);
  if(id==="history") return renderHistory(main);
}

function renderHistory(main){
  const rows = QUESTIONS.map(q=>{
    const p = progress[q.id];
    return {q, p};
  });
  const attempted = rows.filter(r=>r.p && r.p.attempts);
  const wrongOnly = attempted.filter(r=>!isDone(r.q.id));

  const rowHtml = (r)=>{
    const {q,p} = r;
    const statusBadge = isDone(q.id)
      ? '<span class="tag" style="color:var(--primary-deep); background:var(--primary-subdued); border-color:transparent;">done</span>'
      : (p && p.attempts ? '<span class="tag" style="color:var(--ruby-deep); background:var(--ruby-tint); border-color:transparent;">struggling</span>' : '<span class="tag">not started</span>');
    const lastAns = p && p.lastAnswer ? esc(String(p.lastAnswer).slice(0,80)) : '<span style="color:var(--ink-faint);">—</span>';
    const attempts = p ? (p.attempts||0) : 0;
    return `<tr>
      <td>${statusBadge}</td>
      <td>${esc(q.title)}</td>
      <td class="tnum">${attempts}</td>
      <td class="mono" style="font-size:12.5px;">${lastAns}</td>
      <td><button class="btn ghost" style="padding:6px 14px; font-size:12.5px;" onclick="navigateTo('${q.id}')">Open</button></td>
    </tr>`;
  };

  main.innerHTML = `

/* ---------- global safety net ---------- */
let toastTimer = null;
function showToast(msg){
  let t = document.getElementById("toast");
  if(!t){
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 20px; border-radius:var(--pill); font-size:13.5px; box-shadow:var(--shadow-2); z-index:999; max-width:90vw; text-align:center;";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display = "none"; }, 4000);
}
window.addEventListener("error", (e)=>{
  console.error("Uncaught error:", e.error || e.message);
  showToast("Something glitched, but your progress is safe. Try again, or go Home.");
});
window.addEventListener("unhandledrejection", (e)=>{
  console.error("Unhandled promise rejection:", e.reason);
  showToast("Something glitched, but your progress is safe. Try again, or go Home.");
});

/* ---------- boot ---------- */
try{

}catch(err){
  console.error("Initial render failed", err);
  renderCrashFallback(err);
